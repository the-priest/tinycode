[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tinycode"
dynamic = ["version"]
description = "A fast, reliable, fully local coding agent for the terminal (Ollama + Ling-3.0-tiny)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "the-priest" }]
keywords = ["ai", "coding-agent", "ollama", "tui", "local-llm", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
dependencies = [
  "textual>=3.0,<9",
  "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21"]

[project.urls]
Homepage = "https://github.com/the-priest/tinycode"

[project.scripts]
tinycode = "tinycode.cli:main"

[tool.setuptools.packages.find]
include = ["tinycode*"]

[tool.setuptools.package-data]
tinycode = ["assets/*.js"]

[tool.setuptools.dynamic]
version = { attr = "tinycode.__version__" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
