name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.11", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: installer smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: |
          bash -n install.sh
          HOME="$RUNNER_TEMP/home" ./install.sh -y --no-ollama --no-model --no-desktop
          "$RUNNER_TEMP/home/.local/bin/tinycode" --version
